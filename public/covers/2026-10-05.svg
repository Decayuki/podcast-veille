<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre et élégant -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Titre de l'épisode (centré, taille lisible, blanc) -->
  <text x="700" y="0" font-family="Arial, sans-serif" font-size="70" fill="white" text-anchor="middle" font-weight="bold">
    <tspan x="700" dy="565">IA : Chasseurs de Bugs,</tspan>
    <tspan x="700" dy="90">Modèles Rebelles</tspan>
    <tspan x="700" dy="90">et Budget Sous Contrôle</tspan>
  </text>

  <!-- Icône 1: Réseau/IA (symbolise l'IA, les Modèles et les avancées) - en haut à gauche du titre -->
  <g transform="translate(450, 480)">
    <circle cx="0" cy="0" r="20" fill="#00e6e6"/>
    <circle cx="-40" cy="-40" r="20" fill="#00e6e6"/>
    <circle cx="40" cy="-40" r="20" fill="#00e6e6"/>
    <line x1="0" y1="0" x2="-40" y2="-40" stroke="#00e6e6" stroke-width="6"/>
    <line x1="0" y1="0" x2="40" y2="-40" stroke="#00e6e6" stroke-width="6"/>
  </g>

  <!-- Icône 2: Engrenage (symbolise le Contrôle, les mécanismes, les "Bugs" et les modèles "rebelles") - en bas à droite du titre -->
  <g transform="translate(950, 800)">
    <circle cx="0" cy="0" r="30" fill="#ff66b2"/>
    <circle cx="0" cy="0" r="15" fill="#1a1a2e"/>
    <rect x="-8" y="-45" width="16" height="20" fill="#ff66b2" transform="rotate(0 0 0)"/>
    <rect x="-8" y="-45" width="16" height="20" fill="#ff66b2" transform="rotate(60 0 0)"/>
    <rect x="-8" y="-45" width="16" height="20" fill="#ff66b2" transform="rotate(120 0 0)"/>
    <rect x="-8" y="-45" width="16" height="20" fill="#ff66b2" transform="rotate(180 0 0)"/>
    <rect x="-8" y="-45" width="16" height="20" fill="#ff66b2" transform="rotate(240 0 0)"/>
    <rect x="-8" y="-45" width="16" height="20" fill="#ff66b2" transform="rotate(300 0 0)"/>
  </g>

  <!-- Nom du podcast (petit, centré en bas) -->
  <text x="700" y="1250" font-family="Arial, sans-serif" font-size="36" fill="#cccccc" text-anchor="middle">
    Veille de Marc
  </text>

  <!-- Date (petit, centré en bas) -->
  <text x="700" y="1300" font-family="Arial, sans-serif" font-size="30" fill="#aaaaaa" text-anchor="middle">
    2026-10-05
  </text>
</svg>