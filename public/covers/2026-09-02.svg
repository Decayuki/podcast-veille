<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre pour un style tech -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Formes géométriques minimalistes représentant les sujets tech -->
  <!-- Réseau de nœuds et de connexions (Graphes de Connaissances, LLM, Réseaux neuronaux) -->
  <circle cx="350" cy="450" r="40" fill="#ffa7c4"/>
  <circle cx="1050" cy="450" r="40" fill="#939ffc"/>
  <circle cx="350" cy="950" r="40" fill="#939ffc"/>
  <circle cx="1050" cy="950" r="40" fill="#ffa7c4"/>

  <!-- Lignes de connexion entre les nœuds -->
  <line x1="350" y1="450" x2="1050" y2="450" stroke="#939ffc" stroke-width="5"/>
  <line x1="350" y1="950" x2="1050" y2="950" stroke="#ffa7c4" stroke-width="5"/>
  <line x1="350" y1="450" x2="350" y2="950" stroke="#ffa7c4" stroke-width="5"/>
  <line x1="1050" y1="450" x2="1050" y2="950" stroke="#939ffc" stroke-width="5"/>
  <line x1="350" y1="450" x2="1050" y2="950" stroke="#ffe66d" stroke-width="5"/>
  <line x1="1050" y1="450" x2="350" y2="950" stroke="#ffe66d" stroke-width="5"/>

  <!-- Carré central, symbolisant un bloc sécurisé ou un noyau d'IA (Sécurité des IA) -->
  <rect x="650" y="650" width="100" height="100" fill="#ffe66d" transform="rotate(45 700 700)"/>

  <!-- Connexions au carré central -->
  <line x1="350" y1="450" x2="700" y2="700" stroke="#ffa7c4" stroke-width="5"/>
  <line x1="1050" y1="450" x2="700" y2="700" stroke="#939ffc" stroke-width="5"/>
  <line x1="350" y1="950" x2="700" y2="700" stroke="#939ffc" stroke-width="5"/>
  <line x1="1050" y1="950" x2="700" y2="700" stroke="#ffa7c4" stroke-width="5"/>

  <!-- Titre de l'épisode, centré et lisible -->
  <text x="700" y="590" font-family="sans-serif" font-size="90" font-weight="bold" fill="#64ffda" text-anchor="middle">
    <tspan x="700" dy="0">Au-delà des LLM :</tspan>
    <tspan x="700" dy="110">Graphes de Connaissances Géants</tspan>
    <tspan x="700" dy="110">et Sécurité des IA</tspan>
  </text>

  <!-- Nom du podcast en petit en bas -->
  <text x="700" y="1320" font-family="sans-serif" font-size="36" fill="#cccccc" text-anchor="middle">
    Veille de Marc
  </text>

  <!-- Date en petit en bas -->
  <text x="700" y="1360" font-family="sans-serif" font-size="30" fill="#cccccc" text-anchor="middle">
    2026-09-02
  </text>
</svg>