<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Fond sombre -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Titre de l'épisode -->
  <text x="700" y="500" fill="#e0e0e0" font-size="65" font-weight="bold" text-anchor="middle">
    <tspan x="700" dy="0">Quand l'IA s'invite</tspan>
    <tspan x="700" dy="75">dans notre cerveau</tspan>
    <tspan x="700" dy="75">et s'échappe en ligne</tspan>
  </text>

  <!-- Icône 1: Cerveau stylisé (pour "cerveau") -->
  <g transform="translate(250 450)">
    <path d="M 100 20 C 50 20 20 70 20 100 C 20 130 50 180 100 180 C 150 180 180 130 180 100 C 180 70 150 20 100 20 Z M 100 20 L 100 180"
          fill="none" stroke="#00ffff" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Icône 2: Réseau / Connexions (pour "s'échappe en ligne") -->
  <g transform="translate(950 450)">
    <circle cx="100" cy="50" r="15" fill="#ff00ff"/>
    <circle cx="50" cy="150" r="15" fill="#ff00ff"/>
    <circle cx="150" cy="150" r="15" fill="#ff00ff"/>
    <line x1="100" y1="50" x2="50" y2="150" stroke="#ff00ff" stroke-width="5"/>
    <line x1="100" y1="50" x2="150" y2="150" stroke="#ff00ff" stroke-width="5"/>
    <line x1="50" y1="150" x2="150" y2="150" stroke="#ff00ff" stroke-width="5"/>
  </g>

  <!-- Nom du podcast -->
  <text x="100" y="1300" fill="#a0a0a0" font-size="30">Veille de Marc</text>

  <!-- Date de l'épisode -->
  <text x="1300" y="1300" fill="#a0a0a0" font-size="30" text-anchor="end">2026-08-03</text>
</svg>