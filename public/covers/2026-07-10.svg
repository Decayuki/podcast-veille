<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
    <!-- Fond sombre -->
    <rect width="100%" height="100%" fill="#1a1a2e"/>

    <!-- Icône IA (Puce stylisée) -->
    <g transform="translate(250, 250)">
        <rect x="0" y="0" width="180" height="180" rx="25" ry="25" fill="#57ffdd"/>
        <circle cx="90" cy="90" r="50" fill="#1a1a2e"/>
        <!-- Broches -->
        <line x1="0" y1="40" x2="-30" y2="40" stroke="#57ffdd" stroke-width="10" stroke-linecap="round"/>
        <line x1="0" y1="90" x2="-30" y2="90" stroke="#57ffdd" stroke-width="10" stroke-linecap="round"/>
        <line x1="0" y1="140" x2="-30" y2="140" stroke="#57ffdd" stroke-width="10" stroke-linecap="round"/>
        <line x1="180" y1="40" x2="210" y2="40" stroke="#57ffdd" stroke-width="10" stroke-linecap="round"/>
        <line x1="180" y1="90" x2="210" y2="90" stroke="#57ffdd" stroke-width="10" stroke-linecap="round"/>
        <line x1="180" y1="140" x2="210" y2="140" stroke="#57ffdd" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- Icône Rust (Engrenage stylisé) -->
    <g transform="translate(950, 250)">
        <circle cx="90" cy="90" r="85" fill="#ffdd57"/>
        <circle cx="90" cy="90" r="40" fill="#1a1a2e"/>
        <!-- 8 Dents de l'engrenage -->
        <rect x="80" y="5" width="20" height="30" fill="#ffdd57"/>
        <rect x="80" y="5" width="20" height="30" fill="#ffdd57" transform="rotate(45 90 90)"/>
        <rect x="80" y="5" width="20" height="30" fill="#ffdd57" transform="rotate(90 90 90)"/>
        <rect x="80" y="5" width="20" height="30" fill="#ffdd57" transform="rotate(135 90 90)"/>
        <rect x="80" y="5" width="20" height="30" fill="#ffdd57" transform="rotate(180 90 90)"/>
        <rect x="80" y="5" width="20" height="30" fill="#ffdd57" transform="rotate(225 90 90)"/>
        <rect x="80" y="5" width="20" height="30" fill="#ffdd57" transform="rotate(270 90 90)"/>
        <rect x="80" y="5" width="20" height="30" fill="#ffdd57" transform="rotate(315 90 90)"/>
    </g>

    <!-- Titre de l'épisode -->
    <text x="700" y="650" text-anchor="middle" font-family="sans-serif" font-size="85" fill="#e0f2f7" font-weight="bold">
        <tspan x="700" dy="0">L'IA à Prix d'Or</tspan>
        <tspan x="700" dy="110">et la Révolution Rust</tspan>
    </text>

    <!-- Nom du podcast -->
    <text x="700" y="1250" text-anchor="middle" font-family="sans-serif" font-size="35" fill="#8888aa">Veille de Marc</text>

    <!-- Date -->
    <text x="700" y="1300" text-anchor="middle" font-family="sans-serif" font-size="35" fill="#8888aa">2026-07-10</text>
</svg>