<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Titre de l'épisode (centré, en gras, sur plusieurs lignes) -->
  <text x="700" y="550" font-family="sans-serif" font-size="65" fill="#e0e0e0" text-anchor="middle" font-weight="bold">
    <tspan x="700" dy="0">IA et Dev :</tspan>
    <tspan x="700" dy="75">L'Alberta sécurisée, Next.js vulnérable,</tspan>
    <tspan x="700" dy="75">et l'IA dans votre navigateur !</tspan>
  </text>

  <!-- Icône 1 : IA (Hexagone vibrant en haut à gauche) -->
  <polygon points="350,250 450,200 550,250 550,350 450,400 350,350" fill="#e83e8c"/>

  <!-- Icône 2 : Dev / Sécurité (Carré vibrant en bas à droite, légèrement incliné) -->
  <rect x="950" y="850" width="150" height="150" fill="#38b2ac" transform="rotate(15 1025 925)"/>

  <!-- Nom du podcast (petit, en bas) -->
  <text x="700" y="1250" font-family="sans-serif" font-size="30" fill="#999999" text-anchor="middle">
    Veille de Marc
  </text>

  <!-- Date (petite, en bas) -->
  <text x="700" y="1290" font-family="sans-serif" font-size="25" fill="#999999" text-anchor="middle">
    2026-07-07
  </text>
</svg>