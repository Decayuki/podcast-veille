<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre -->
  <rect x="0" y="0" width="1400" height="1400" fill="#1a1a2e"/>

  <!-- Icône tech abstraite : "Cerveau" ou "Puce" d'IA avec des connexions -->
  <g transform="translate(700, 400)">
    <!-- Effet de halo subtil pour la forme principale -->
    <rect x="-180" y="-180" width="360" height="360" fill="#00ff80" rx="40" ry="40" opacity="0.05"/>
    <rect x="-150" y="-150" width="300" height="300" fill="#00ff80" rx="30" ry="30" opacity="0.1"/>
    
    <!-- Forme principale de la puce/noyau -->
    <rect x="-120" y="-120" width="240" height="240" fill="#00ff80" rx="20" ry="20"/>
    
    <!-- Détails internes (lignes de circuit) -->
    <line x1="-90" y1="-60" x2="90" y2="-60" stroke="#1a1a2e" stroke-width="12" opacity="0.7"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#1a1a2e" stroke-width="12" opacity="0.7"/>
    <line x1="-90" y1="60" x2="90" y2="60" stroke="#1a1a2e" stroke-width="12" opacity="0.7"/>

    <!-- Points de connexion / nœuds périphériques -->
    <circle cx="-250" cy="-250" r="20" fill="#8000ff"/>
    <circle cx="250" cy="-250" r="20" fill="#8000ff"/>
    <circle cx="-250" cy="250" r="20" fill="#8000ff"/>
    <circle cx="250" cy="250" r="20" fill="#8000ff"/>

    <!-- Lignes de connexion entre le noyau et les nœuds -->
    <line x1="-120" y1="-120" x2="-250" y2="-250" stroke="#8000ff" stroke-width="6" opacity="0.7"/>
    <line x1="120" y1="-120" x2="250" y2="-250" stroke="#8000ff" stroke-width="6" opacity="0.7"/>
    <line x1="-120" y1="120" x2="-250" y2="250" stroke="#8000ff" stroke-width="6" opacity="0.7"/>
    <line x1="120" y1="120" x2="250" y2="250" stroke="#8000ff" stroke-width="6" opacity="0.7"/>
  </g>

  <!-- Titre de l'épisode -->
  <text x="700" y="780" text-anchor="middle" fill="white" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;" 
        font-size="75" font-weight="bold">
    <tspan x="700" dy="0em">Course aux super IA</tspan>
    <tspan x="700" dy="1.2em">et révélations sombres :</tspan>
    <tspan x="700" dy="1.2em">L'actu tech de la semaine</tspan>
  </text>

  <!-- Nom du podcast -->
  <text x="700" y="1250" text-anchor="middle" fill="white" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;" 
        font-size="40" opacity="0.8">
    Veille de Marc
  </text>

  <!-- Date de l'épisode -->
  <text x="700" y="1300" text-anchor="middle" fill="white" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;" 
        font-size="32" opacity="0.6">
    2026-09-23
  </text>
</svg>