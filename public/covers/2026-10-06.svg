<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre -->
  <rect x="0" y="0" width="1400" height="1400" fill="#1a1a2e"/>

  <!-- Titre de l'épisode (centré et lisible) -->
  <text x="700" y="500" font-family="sans-serif" font-size="100" font-weight="bold" fill="#00f0f0" text-anchor="middle">L'IA entre</text>
  <text x="700" y="620" font-family="sans-serif" font-size="100" font-weight="bold" fill="#00f0f0" text-anchor="middle">Rêves de Futur</text>
  <text x="700" y="740" font-family="sans-serif" font-size="100" font-weight="bold" fill="#00f0f0" text-anchor="middle">et Risques Existentiels</text>

  <!-- Icône 1 : Nœuds / Réseau neuronal (pour l'IA et la complexité) -->
  <!-- Positionné en haut à gauche -->
  <circle cx="280" cy="300" r="40" fill="#ff007f"/>
  <circle cx="380" cy="350" r="40" fill="#00f0f0"/>
  <circle cx="280" cy="400" r="40" fill="#ff007f"/>
  <circle cx="380" cy="450" r="40" fill="#00f0f0"/>
  
  <line x1="280" y1="300" x2="380" y2="350" stroke="#ff007f" stroke-width="6" stroke-opacity="0.8" stroke-linecap="round"/>
  <line x1="380" y1="350" x2="280" y2="400" stroke="#00f0f0" stroke-width="6" stroke-opacity="0.8" stroke-linecap="round"/>
  <line x1="280" y1="400" x2="380" y2="450" stroke="#ff007f" stroke-width="6" stroke-opacity="0.8" stroke-linecap="round"/>
  <line x1="280" y1="300" x2="280" y2="400" stroke="#ff007f" stroke-width="6" stroke-opacity="0.8" stroke-linecap="round"/>
  <line x1="380" y1="350" x2="380" y2="450" stroke="#00f0f0" stroke-width="6" stroke-opacity="0.8" stroke-linecap="round"/>
  <line x1="280" y1="300" x2="380" y2="450" stroke="#ff007f" stroke-width="6" stroke-opacity="0.8" stroke-linecap="round"/>

  <!-- Icône 2 : Chevrons (pour le futur, la croissance et les risques) -->
  <!-- Positionné en bas à droite, avec un léger décalage pour suggérer le "risque" ou la dynamique -->
  <path d="M1000 1100 L1100 1000 L1200 1100" stroke="#00f0f0" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1020 1150 L1120 1050 L1220 1150" stroke="#ff007f" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1040 1200 L1140 1100 L1240 1200" stroke="#00f0f0" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Nom du podcast -->
  <text x="50" y="1350" font-family="sans-serif" font-size="35" fill="#cccccc" text-anchor="start">Veille de Marc</text>

  <!-- Date de l'épisode -->
  <text x="1350" y="1350" font-family="sans-serif" font-size="35" fill="#cccccc" text-anchor="end">2026-10-06</text>
</svg>