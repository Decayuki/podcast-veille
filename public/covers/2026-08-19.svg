<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Titre de l'épisode (centré et lisible) -->
  <text x="700" y="520" font-family="Arial, sans-serif" font-size="100" fill="white" text-anchor="middle" font-weight="bold">Mojo, Ray, et les Agents :</text>
  <text x="700" y="630" font-family="Arial, sans-serif" font-size="100" fill="white" text-anchor="middle" font-weight="bold">La Révolution Silencieuse</text>
  <text x="700" y="740" font-family="Arial, sans-serif" font-size="100" fill="white" text-anchor="middle" font-weight="bold">du Code</text>

  <!-- Icônes / Formes géométriques simples liées à la tech -->
  <!-- Deux chevrons stylisés pour le "Code" / "Mojo" -->
  <path d="M 250 350 L 450 450 L 250 550" stroke="#00f0ff" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1150 350 L 950 450 L 1150 550" stroke="#ff00ff" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Trois cercles interconnectés pour "Ray" / "Agents" / IA -->
  <circle cx="300" cy="880" r="40" fill="#aaff00"/>
  <circle cx="700" cy="950" r="40" fill="#ffcc00"/>
  <circle cx="1100" cy="880" r="40" fill="#00f0ff"/>
  <line x1="300" y1="880" x2="700" y2="950" stroke="#aaff00" stroke-width="10" stroke-linecap="round"/>
  <line x1="700" y1="950" x2="1100" y2="880" stroke="#ffcc00" stroke-width="10" stroke-linecap="round"/>
  <line x1="1100" y1="880" x2="300" y2="880" stroke="#00f0ff" stroke-width="10" stroke-linecap="round"/>

  <!-- Nom du podcast en bas -->
  <text x="700" y="1250" font-family="Arial, sans-serif" font-size="40" fill="#cccccc" text-anchor="middle">Veille de Marc</text>
  
  <!-- Date en bas -->
  <text x="700" y="1300" font-family="Arial, sans-serif" font-size="35" fill="#cccccc" text-anchor="middle">2026-08-19</text>
