<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre -->
  <rect x="0" y="0" width="1400" height="1400" fill="#1a1a2e"/>

  <!-- Icône 1: Cœur tech/IA (rectangle stylisé avec circuits) - Positionné en haut à gauche -->
  <g transform="translate(400 300) rotate(15)">
    <rect x="-150" y="-150" width="300" height="300" rx="30" ry="30" fill="#00FFFF" opacity="0.7"/>
    <line x1="-100" y1="-100" x2="100" y2="100" stroke="#1a1a2e" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="-100" x2="-100" y2="100" stroke="#1a1a2e" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Icône 2: Bouclier de sécurité (forme polygonale simple) - Positionné en haut à droite -->
  <g transform="translate(1000 300) rotate(-15)">
    <polygon points="0,-150 100,0 100,100 0,150 -100,100 -100,0" fill="#FF69B4" opacity="0.7"/>
  </g>

  <!-- Titre de l'épisode (centré, en gras, taille lisible) -->
  <text x="700" y="850" font-family="Arial, sans-serif" font-size="100" fill="white" text-anchor="middle" font-weight="bold">
    <tspan x="700" dy="0">Mémoire d'Agents,</tspan>
    <tspan x="700" dy="110">Sécurité IA et</tspan>
    <tspan x="700" dy="110">Batailles Open Source</tspan>
  </text>

  <!-- Nom du podcast (petit, en bas à gauche) -->
  <text x="100" y="1300" font-family="Arial, sans-serif" font-size="30" fill="white" text-anchor="start">Veille de Marc</text>

  <!-- Date (petite, en bas à droite) -->
  <text x="1300" y="1300" font-family="Arial, sans-serif" font-size="30" fill="white" text-anchor="end">2026-06-04</text>
</svg>