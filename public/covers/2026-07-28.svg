<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Main Title -->
  <text x="700" y="250" font-family="sans-serif" font-size="90" font-weight="bold" fill="white" text-anchor="middle">Open-Weights en guerre,</text>
  <text x="700" y="360" font-family="sans-serif" font-size="90" font-weight="bold" fill="white" text-anchor="middle">agents en force</text>
  <text x="700" y="470" font-family="sans-serif" font-size="90" font-weight="bold" fill="white" text-anchor="middle">et la réalité des projets IA</text>

  <!-- Tech/AI Icons: Central core, network, and conflict elements -->
  <!-- Central "core" element (stylized processor/brain node) -->
  <circle cx="700" cy="800" r="120" fill="#00f0ff" opacity="0.8"/>
  <rect x="620" y="720" width="160" height="160" rx="20" ry="20" fill="#00f0ff" opacity="0.6"/>

  <!-- Network/Data flow lines and nodes -->
  <line x1="700" y1="800" x2="500" y2="600" stroke="#ff007f" stroke-width="8" stroke-linecap="round"/>
  <circle cx="500" cy="600" r="25" fill="#ff007f"/>

  <line x1="700" y1="800" x2="900" y2="600" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="900" cy="600" r="25" fill="#00f0ff"/>

  <line x1="700" y1="800" x2="500" y2="1000" stroke="#ff007f" stroke-width="8" stroke-linecap="round"/>
  <circle cx="500" cy="1000" r="25" fill="#ff007f"/>

  <line x1="700" y1="800" x2="900" y2="1000" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="900" cy="1000" r="25" fill="#00f0ff"/>

  <!-- Conflict/Agents element: two opposing arrow-like shapes -->
  <polygon points="400,800 500,750 500,850" fill="#ff007f"/>
  <polygon points="1000,800 900,750 900,850" fill="#00ff80"/>

  <!-- Podcast Name -->
  <text x="700" y="1270" font-family="sans-serif" font-size="40" fill="#cccccc" text-anchor="middle">Veille de Marc</text>

  <!-- Date -->
  <text x="700" y="1330" font-family="sans-serif" font-size="30" fill="#888888" text-anchor="middle">2026-07-28</text>
</svg>