<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Icon 1: AI / Neural Network (top-left) -->
  <g transform="translate(150, 150)">
    <circle cx="0" cy="0" r="50" fill="#00FFFF" opacity="0.7"/>
    <circle cx="120" cy="-60" r="40" fill="#FF00FF" opacity="0.7"/>
    <circle cx="180" cy="50" r="60" fill="#39FF14" opacity="0.7"/>
    <line x1="0" y1="0" x2="120" y2="-60" stroke="#00FFFF" stroke-width="6" opacity="0.5"/>
    <line x1="120" y1="-60" x2="180" y2="50" stroke="#FF00FF" stroke-width="6" opacity="0.5"/>
    <line x1="0" y1="0" x2="180" y2="50" stroke="#39FF14" stroke-width="6" opacity="0.5"/>
  </g>

  <!-- Icon 2: Trifecta / Agent (bottom-right) -->
  <g transform="translate(1100, 1100)">
    <!-- Three simple, slightly overlapping triangles for "trifecta" and dynamic agency -->
    <polygon points="0,0 100,0 50,-80" fill="#FF00FF" opacity="0.8"/>
    <polygon points="50,-40 150,-40 100,-120" fill="#39FF14" opacity="0.8" transform="rotate(15 75 -80)"/>
    <polygon points="100,-80 200,-80 150,-160" fill="#00FFFF" opacity="0.8" transform="rotate(30 125 -120)"/>
  </g>

  <!-- Episode Title -->
  <text x="700" y="580" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#F0F0F0" font-size="80">
    <tspan x="700" dy="0em">Quand l'IA devient agent autonome :</tspan>
    <tspan x="700" dy="1.2em">La 'trifecta létale'</tspan>
    <tspan x="700" dy="1.2em">et la fin des embargos</tspan>
  </text>

  <!-- Podcast Name -->
  <text x="700" y="1280" text-anchor="middle" font-family="sans-serif" fill="#AAAAAA" font-size="45">Veille de Marc</text>

  <!-- Date -->
  <text x="700" y="1340" text-anchor="middle" font-family="sans-serif" fill="#AAAAAA" font-size="45">2026-08-31</text>
</svg>