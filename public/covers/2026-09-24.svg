<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
    <!-- Fond sombre -->
    <rect x="0" y="0" width="1400" height="1400" fill="#1a1a2e"/>

    <!-- Titre de l'épisode (centré et multi-lignes) -->
    <text x="700" y="450" font-family="Arial, Helvetica, sans-serif" font-size="90" fill="#f1fa8c" text-anchor="middle" font-weight="bold">L'IA chercheuse,</text>
    <text x="700" y="560" font-family="Arial, Helvetica, sans-serif" font-size="90" fill="#8be9fd" text-anchor="middle" font-weight="bold">l'IA espionne...</text>
    <text x="700" y="670" font-family="Arial, Helvetica, sans-serif" font-size="80" fill="#50fa7b" text-anchor="middle">et l'IA qui parle</text>
    <text x="700" y="760" font-family="Arial, Helvetica, sans-serif" font-size="80" fill="#ff79c6" text-anchor="middle">pour cent fois moins cher !</text>

    <!-- Icône 1 : Réseau de noeuds (représentant l'IA, la recherche, le calcul) - en haut à gauche -->
    <g transform="translate(150, 150)">
        <circle cx="0" cy="0" r="30" fill="#8be9fd" opacity="0.8"/>
        <circle cx="150" cy="-50" r="30" fill="#f1fa8c" opacity="0.8"/>
        <circle cx="300" cy="0" r="30" fill="#50fa7b" opacity="0.8"/>
        <circle cx="150" cy="50" r="30" fill="#ff79c6" opacity="0.8"/>
        <!-- Lignes de connexion -->
        <line x1="0" y1="0" x2="150" y2="-50" stroke="#8be9fd" stroke-width="8" stroke-linecap="round"/>
        <line x1="150" y1="-50" x2="300" y2="0" stroke="#f1fa8c" stroke-width="8" stroke-linecap="round"/>
        <line x1="300" y1="0" x2="150" y2="50" stroke="#50fa7b" stroke-width="8" stroke-linecap="round"/>
        <line x1="150" y1="50" x2="0" y2="0" stroke="#ff79c6" stroke-width="8" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="300" y2="0" stroke="#8be9fd" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
        <line x1="150" y1="-50" x2="150" y2="50" stroke="#f1fa8c" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Icône 2 : Ondes sonores (représentant la synthèse vocale, la parole) - en bas à droite -->
    <g transform="translate(900, 950)">
        <path d="M0,50 C50,-20 150,-20 200,50 S300,120 350,50" fill="none" stroke="#ff79c6" stroke-width="12" stroke-linecap="round"/>
        <path d="M0,80 C50,10 150,10 200,80 S300,150 350,80" fill="none" stroke="#50fa7b" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- Nom du podcast -->
    <text x="700" y="1250" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#f1fa8c" text-anchor="middle">Veille de Marc</text>

    <!-- Date -->
    <text x="700" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#8be9fd" text-anchor="middle">2026-09-24</text>
</svg>