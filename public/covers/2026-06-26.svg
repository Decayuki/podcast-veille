<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Icônes géométriques simples -->
  <!-- Icône 1: Hexagone pour l'IA/Agents (Cyan vif) -->
  <!-- Centre de l'hexagone ajusté pour être à gauche du titre, autour de Y=350 -->
  <polygon points="600,350 575,393.3 525,393.3 500,350 525,306.7 575,306.7" fill="#00bfff"/>

  <!-- Icône 2: Réseau de noeuds pour la Géopolitique/Connectivité (Magenta vif) -->
  <!-- Centre du réseau ajusté pour être à droite du titre, autour de Y=350 -->
  <circle cx="850" cy="300" r="20" fill="#ff007f"/>
  <circle cx="810" cy="400" r="20" fill="#ff007f"/>
  <circle cx="890" cy="400" r="20" fill="#ff007f"/>
  <line x1="850" y1="300" x2="810" y2="400" stroke="#ff007f" stroke-width="5"/>
  <line x1="850" y1="300" x2="890" y2="400" stroke="#ff007f" stroke-width="5"/>
  <line x1="810" y1="400" x2="890" y2="400" stroke="#ff007f" stroke-width="5"/>

  <!-- Titre de l'épisode (centré, en plusieurs lignes) -->
  <text x="700" y="550" font-family="Arial, Helvetica, sans-serif" font-size="80" fill="white" text-anchor="middle" font-weight="bold">
    Au-delà du Chat :
  </text>
  <text x="700" y="640" font-family="Arial, Helvetica, sans-serif" font-size="80" fill="white" text-anchor="middle" font-weight="bold">
    Agents IA, Géopolitique Tech
  </text>
  <text x="700" y="730" font-family="Arial, Helvetica, sans-serif" font-size="80" fill="white" text-anchor="middle" font-weight="bold">
    et Fatigue du Vibecoding
  </text>

  <!-- Nom du podcast (en bas, petit) -->
  <text x="700" y="1250" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#00bfff" text-anchor="middle" font-weight="bold">
    Veille de Marc
  </text>

  <!-- Date (en bas, petit) -->
  <text x="700" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#AAAAAA" text-anchor="middle">
    2026-06-26
  </text>
</svg>
