<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre pour un style tech élégant -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Icône 1 : Un carré pivoté avec des coins arrondis, évoquant une puce, une structure ou un cadre IA -->
  <rect x="300" y="180" width="400" height="400" rx="60" fill="#64B6FF" transform="rotate(-15 500 380)"/>

  <!-- Icône 2 : Un cercle vibrant, représentant l'intelligence, les données ou l'agent autonome -->
  <circle cx="850" cy="380" r="200" fill="#FF6B6B"/>

  <!-- Titre de l'épisode - centré, couleurs vives, police lisible -->
  <text x="700" y="700" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="70px" fill="#8AFF8A">
    <tspan x="700" dy="-1.5em">IA et Éthique :</tspan>
    <tspan x="700" dy="1.2em">Quand l'Agent Devient</tspan>
    <tspan x="700" dy="1.2em">Créateur et Défenseur</tspan>
  </text>

  <!-- Nom du podcast - en bas, petit et discret -->
  <text x="700" y="1250" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36px" fill="white">
    Veille de Marc
  </text>

  <!-- Date de l'épisode - en bas, petit et discret -->
  <text x="700" y="1300" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32px" fill="#cccccc">
    2026-07-02
  </text>
</svg>