<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre -->
  <rect x="0" y="0" width="1400" height="1400" fill="#1a1a2e"/>

  <!-- Icônes/Formes géométriques (IA: Co-Pilote ou Pirate) -->
  <g transform="translate(700, 350)">
    <!-- Noyau central IA (Cercles concentriques pour l'abstraction) -->
    <circle cx="0" cy="0" r="100" fill="#f0f0f0" opacity="0.1"/>
    <circle cx="0" cy="0" r="80" fill="#f0f0f0" opacity="0.2"/>
    <circle cx="0" cy="0" r="60" fill="#f0f0f0"/>

    <!-- Côté "Co-Pilote" (bleu vif, ligne continue pour la guidance) -->
    <rect x="-250" y="-30" width="100" height="60" rx="10" ry="10" fill="#00f0ff"/>
    <line x1="-150" y1="0" x2="-60" y2="0" stroke="#00f0ff" stroke-width="10" stroke-linecap="round"/>

    <!-- Côté "Pirate" (magenta vif, ligne discontinue pour la disruption) -->
    <rect x="150" y="-30" width="100" height="60" rx="10" ry="10" fill="#ff00ff"/>
    <line x1="60" y1="0" x2="150" y2="0" stroke="#ff00ff" stroke-width="10" stroke-linecap="round" stroke-dasharray="20 10"/>
  </g>

  <!-- Titre de l'épisode (centré) -->
  <text text-anchor="middle" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-weight="bold" fill="#f0f0f0">
    <tspan x="700" y="500" font-size="120">L'IA : Votre</tspan>
    <tspan x="700" dy="140" font-size="120">Co-Pilote ou Votre</tspan>
    <tspan x="700" dy="140" font-size="120">Pirate ?</tspan>
  </text>

  <!-- Nom du podcast et date (en bas) -->
  <g fill="#f0f0f0" text-anchor="middle" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif">
    <text x="700" y="1250" font-size="40">Veille de Marc</text>
    <text x="700" y="1300" font-size="30" opacity="0.8">2026-09-03</text>
  </g>
</svg>