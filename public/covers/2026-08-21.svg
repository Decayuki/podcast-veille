<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre et élégant -->
  <rect x="0" y="0" width="1400" height="1400" fill="#1a1a2e"/>

  <!-- Titre de l'épisode (centré, en deux lignes) -->
  <text x="700" y="580" font-family="sans-serif" font-size="95" font-weight="bold" fill="#f0f0f0" text-anchor="middle">
    Tokens, Bugs et IA Mystère
  </text>
  <text x="700" y="700" font-family="sans-serif" font-size="75" fill="#f0f0f0" text-anchor="middle">
    La Veille Tech qui Fait le Buzz
  </text>

  <!-- Icône "Tokens" : Un simple carré (bloc) -->
  <rect x="250" y="300" width="100" height="100" fill="#00bcd4"/>

  <!-- Icône "Bugs" : Une croix stylisée (erreur) -->
  <g transform="translate(1000, 300)">
    <rect x="0" y="40" width="100" height="20" fill="#e91e63" transform="rotate(45 50 50)"/>
    <rect x="0" y="40" width="100" height="20" fill="#e91e63" transform="rotate(-45 50 50)"/>
  </g>

  <!-- Icône "IA Mystère" : Un point d'interrogation géométrique -->
  <g transform="translate(300, 800)">
    <path d="M 0 50 C 0 0, 100 0, 100 50 S 100 100, 50 120 L 50 150"
          stroke="#ffeb3b" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="170" r="10" fill="#ffeb3b"/>
  </g>

  <!-- Nom du podcast (petit, en bas) -->
  <text x="700" y="1250" font-family="sans-serif" font-size="40" fill="#a0a0b0" text-anchor="middle">
    Veille de Marc
  </text>

  <!-- Date (petite, en bas) -->
  <text x="700" y="1300" font-family="sans-serif" font-size="30" fill="#a0a0b0" text-anchor="middle">
    2026-08-21
  </text>
</svg>