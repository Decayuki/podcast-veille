<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">

  <!-- Fond sombre -->
  <rect x="0" y="0" width="1400" height="1400" fill="#1a1a2e"/>

  <!-- Icône IA (Noeud neuronal abstrait) - haut gauche -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="50" fill="#ffdd00"/>
    <circle cx="80" cy="-40" r="30" fill="#00f0ff"/>
    <circle cx="80" cy="40" r="30" fill="#00f0ff"/>
    <line x1="0" y1="0" x2="80" y2="-40" stroke="#00f0ff" stroke-width="6"/>
    <line x1="0" y1="0" x2="80" y2="40" stroke="#00f0ff" stroke-width="6"/>
  </g>

  <!-- Icône IA (Noeud neuronal abstrait) - haut droit (miroir) -->
  <g transform="translate(1100, 300) scale(-1, 1)">
    <circle cx="0" cy="0" r="50" fill="#ffdd00"/>
    <circle cx="80" cy="-40" r="30" fill="#00f0ff"/>
    <circle cx="80" cy="40" r="30" fill="#00f0ff"/>
    <line x1="0" y1="0" x2="80" y2="-40" stroke="#00f0ff" stroke-width="6"/>
    <line x1="0" y1="0" x2="80" y2="40" stroke="#00f0ff" stroke-width="6"/>
  </g>

  <!-- Titre de l'épisode -->
  <text x="700" y="550" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#00f0ff">
    <tspan x="700" dy="0" font-size="90">Agents IA : Entre Promesses et Perils,</tspan>
    <tspan x="700" dy="110" font-size="90">et un Siri 'Open Source' ?</tspan>
  </text>

  <!-- Icône "Branche" (Open Source/Tech) - bas gauche -->
  <g transform="translate(350, 1000) scale(1.2)">
    <circle cx="0" cy="0" r="25" fill="#ffdd00"/>
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#ffdd00" stroke-width="8"/>
    <line x1="0" y1="-70" x2="60" y2="-100" stroke="#ffdd00" stroke-width="8"/>
    <line x1="0" y1="-70" x2="-60" y2="-100" stroke="#ffdd00" stroke-width="8"/>
  </g>

  <!-- Icône "Branche" (Open Source/Tech) - bas droit (miroir) -->
  <g transform="translate(1050, 1000) scale(-1.2, 1.2)">
    <circle cx="0" cy="0" r="25" fill="#ffdd00"/>
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#ffdd00" stroke-width="8"/>
    <line x1="0" y1="-70" x2="60" y2="-100" stroke="#ffdd00" stroke-width="8"/>
    <line x1="0" y1="-70" x2="-60" y2="-100" stroke="#ffdd00" stroke-width="8"/>
  </g>

  <!-- Nom du podcast -->
  <text x="700" y="1290" text-anchor="middle" font-family="sans-serif" font-size="36" fill="#cccccc">
    Veille de Marc
  </text>

  <!-- Date de l'épisode -->
  <text x="700" y="1335" text-anchor="middle" font-family="sans-serif" font-size="36" fill="#cccccc">
    2026-09-15
  </text>

</svg>