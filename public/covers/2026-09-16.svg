<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background sombre -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Icône IA (puce/cerveau stylisé) - en haut -->
  <g transform="translate(700, 300)">
    <rect x="-80" y="-80" width="160" height="160" rx="30" ry="30" fill="#ff577f"/>
    <circle cx="0" cy="0" r="40" fill="#1a1a2e"/>
    <circle cx="-45" cy="-45" r="15" fill="#1a1a2e"/>
    <circle cx="45" cy="-45" r="15" fill="#1a1a2e"/>
    <circle cx="-45" cy="45" r="15" fill="#1a1a2e"/>
    <circle cx="45" cy="45" r="15" fill="#1a1a2e"/>
  </g>

  <!-- Titre de l'épisode - centré -->
  <text x="700" y="500" font-family="Helvetica, Arial, sans-serif" font-size="80" font-weight="bold" fill="#9e7bff" text-anchor="middle">Pizza Bots, IA qui auditent</text>
  <text x="700" y="610" font-family="Helvetica, Arial, sans-serif" font-size="80" font-weight="bold" fill="#9e7bff" text-anchor="middle">et Java qui grandit :</text>
  <text x="700" y="720" font-family="Helvetica, Arial, sans-serif" font-size="80" font-weight="bold" fill="#9e7bff" text-anchor="middle">La Tech de la semaine !</text>

  <!-- Icône Engrenage (pour Bots/Automatisation) - en bas -->
  <g transform="translate(700, 950)">
    <circle cx="0" cy="0" r="80" fill="#00e676"/>
    <circle cx="0" cy="0" r="40" fill="#1a1a2e"/>
    <!-- Dents de l'engrenage -->
    <rect x="-25" y="-105" width="50" height="30" fill="#00e676"/>
    <rect x="-25" y="-105" width="50" height="30" fill="#00e676" transform="rotate(45 0 0)"/>
    <rect x="-25" y="-105" width="50" height="30" fill="#00e676" transform="rotate(90 0 0)"/>
    <rect x="-25" y="-105" width="50" height="30" fill="#00e676" transform="rotate(135 0 0)"/>
    <rect x="-25" y="-105" width="50" height="30" fill="#00e676" transform="rotate(180 0 0)"/>
    <rect x="-25" y="-105" width="50" height="30" fill="#00e676" transform="rotate(225 0 0)"/>
    <rect x="-25" y="-105" width="50" height="30" fill="#00e676" transform="rotate(270 0 0)"/>
    <rect x="-25" y="-105" width="50" height="30" fill="#00e676" transform="rotate(315 0 0)"/>
  </g>

  <!-- Nom du podcast - en bas à gauche -->
  <text x="100" y="1320" font-family="Helvetica, Arial, sans-serif" font-size="35" fill="#a0a0a0" text-anchor="start">Veille de Marc</text>

  <!-- Date - en bas à droite -->
  <text x="1300" y="1320" font-family="Helvetica, Arial, sans-serif" font-size="35" fill="#a0a0a0" text-anchor="end">2026-09-16</text>
</svg>