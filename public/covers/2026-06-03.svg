<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1400" height="1400" fill="#1a1a2e"/>

  <!-- Episode Title -->
  <text x="700" y="400" font-family="sans-serif" font-size="70" fill="#ffffff" text-anchor="middle" font-weight="bold">Quand l'IA prend le contrôle :</text>
  <text x="700" y="480" font-family="sans-serif" font-size="70" fill="#ffffff" text-anchor="middle" font-weight="bold">agents autonomes,</text>
  <text x="700" y="560" font-family="sans-serif" font-size="70" fill="#ffffff" text-anchor="middle" font-weight="bold">guerre des modèles et la</text>
  <text x="700" y="640" font-family="sans-serif" font-size="70" fill="#ffffff" text-anchor="middle" font-weight="bold">"Qualité" menacée</text>

  <!-- Icons/Geometric shapes related to tech -->
