    <rect x="550" y="800" width="300" height="200" rx="20" ry="20" fill="#00FFFF" opacity="0.8"/>
    <rect x="580" y="830" width="240" height="140" rx="10" ry="10" fill="#1a1a2e" opacity="0.4"/>
