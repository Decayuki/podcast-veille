    <line x1="600" y1="900" x2="800" y2="900" stroke="#00FFFF" stroke-width="4" opacity="0.6"/>
    <line x1="600" y1="940" x2="800" y2="940" stroke="#00FFFF" stroke-width="4" opacity="0.6"/>
  </g>

