<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Fond sombre pour un style tech -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Icône 1: Représentation stylisée de l'IA (en haut à gauche) -->
  <!-- Forme angulaire rappelant un 'A' ou un élément de circuit -->
  <g transform="translate(250, 300) scale(1.5)" fill="none" stroke="#FFD700" stroke-width="8" stroke-linecap="round">
    <line x1="0" y1="100" x2="50" y2="0" />
    <line x1="50" y1="0" x2="100" y2="100" />
    <line x1="25" y1="50" x2="75" y2="50" />
  </g>

  <!-- Titre de l'épisode (centré, couleurs vives) -->
  <text x="700" y="500" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="100" fill="#61dafb" text-anchor="middle" letter-spacing="2">
    <tspan x="700" dy="0">GPT-6 pour tous,</tspan>
    <tspan x="700" dy="110">vers Shai-Hulud</tspan>
    <tspan x="700" dy="110">et planètes cachées par l'IA</tspan>
  </text>

  <!-- Icône 2: Représentation d'un réseau ou de connexions de données (en bas à droite) -->
  <!-- Des cercles connectés pour symboliser la complexité des données/réseaux IA -->
  <g transform="translate(1150, 1100) scale(1.5)" fill="#61dafb" stroke="#61dafb" stroke-width="4" stroke-linecap="round">
    <circle cx="0" cy="0" r="10" />
    <circle cx="50" cy="50" r="10" />
    <circle cx="-50" cy="50" r="10" />
    <circle cx="0" cy="100" r="10" />
    <line x1="0" y1="0" x2="50" y2="50" />
    <line x1="0" y1="0" x2="-50" y2="50" />
    <line x1="50" y1="50" x2="0" y2="100" />
    <line x1="-50" y1="50" x2="0" y2="100" />
  </g>

  <!-- Nom du podcast (petit, en bas) -->
  <text x="700" y="1250" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="40" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    Veille de Marc
  </text>

  <!-- Date de l'épisode (petit, en bas) -->
  <text x="700" y="1300" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="30" fill="#FFFFFF" text-anchor="middle" opacity="0.8">
    2026-10-09
  </text>
</svg>