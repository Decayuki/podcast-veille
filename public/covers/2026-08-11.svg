<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Icône 1: IA / Automatisation (abstrait processeur/puce) -->
  <!-- Composé d'un carré avec un carré interne et quatre points, symbolisant un composant électronique ou un cerveau de calcul. -->
  <g transform="translate(550, 320)" fill="none" stroke="#00BFFF" stroke-width="10">
    <rect x="-60" y="-60" width="120" height="120" rx="10" ry="10"/>
    <rect x="-30" y="-30" width="60" height="60" rx="5" ry="5"/>
    <circle cx="-30" cy="-30" r="5" fill="#00BFFF"/>
    <circle cx="30" cy="-30" r="5" fill="#00BFFF"/>
    <circle cx="-30" cy="30" r="5" fill="#00BFFF"/>
    <circle cx="30" cy="30" r="5" fill="#00BFFF"/>
  </g>

  <!-- Icône 2: Open Source (nœuds connectés) -->
  <!-- Composé de deux cercles partiellement superposés et reliés par une ligne, représentant la collaboration et l'interconnexion. -->
  <g transform="translate(850, 320)" fill="none" stroke="#39FF14" stroke-width="10">
    <circle cx="-30" cy="0" r="50"/>
    <circle cx="30" cy="0" r="50"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#39FF14" stroke-width="10"/>
  </g>

  <!-- Titre de l'épisode -->
  <text x="700" y="580" font-family="Arial, sans-serif" font-size="90" fill="#FFFFFF" text-anchor="middle">
    <tspan x="700" dy="0">Pilotes Auto pour IA</tspan>
    <tspan x="700" dy="100">et la Revanche Open Source</tspan>
    <tspan x="700" dy="100">de Meta</tspan>
  </text>

  <!-- Nom du podcast et date -->
  <text x="700" y="1250" font-family="Arial, sans-serif" font-size="30" fill="#AAAAAA" text-anchor="middle">
    <tspan x="700" dy="0">Veille de Marc</tspan>
    <tspan x="700" dy="40">2026-08-11</tspan>
  </text>
</svg>