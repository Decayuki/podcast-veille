<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond sombre et élégant -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Icône 1: Un processeur stylisé avec une "faille" pour symboliser l'IA et les vulnérabilités -->
  <g transform="translate(0, -50)">
    <rect x="580" y="300" width="240" height="240" fill="rgb(255, 0, 150)"/>
    <rect x="620" y="340" width="160" height="160" fill="#1a1a2e"/>
    <path d="M580 300 L820 540" stroke="rgb(0, 255, 255)" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- Titre de l'épisode (centré, en plusieurs lignes si nécessaire) -->
  <text x="700" y="650" font-family="Arial, sans-serif" font-size="85" fill="rgb(0, 255, 255)" text-anchor="middle" font-weight="bold">
    Quand l'IA s'emballe :
  </text>
  <text x="700" y="750" font-family="Arial, sans-serif" font-size="85" fill="rgb(0, 255, 255)" text-anchor="middle" font-weight="bold">
    Agents Autonomes, Mensonges et
  </text>
  <text x="700" y="850" font-family="Arial, sans-serif" font-size="85" fill="rgb(0, 255, 255)" text-anchor="middle" font-weight="bold">
    Vulnérabilités en Chaîne
  </text>

  <!-- Icône 2: Un maillon de chaîne brisé pour souligner les "vulnérabilités en chaîne" -->
  <g transform="translate(0, 50)">
    <path d="M700 900 A80 80 0 1 1 620 820 M780 820 A80 80 0 0 1 700 900" fill="none" stroke="rgb(255, 0, 150)" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Nom du podcast et date (en petit, en bas) -->
  <text x="700" y="1250" font-family="Arial, sans-serif" font-size="30" fill="rgb(200, 200, 200)" text-anchor="middle">
    Veille de Marc
  </text>
  <text x="700" y="1290" font-family="Arial, sans-serif" font-size="30" fill="rgb(200, 200, 200)" text-anchor="middle">
    2026-09-28
  </text>
</svg>