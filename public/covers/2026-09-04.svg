<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif">

  <!-- Fond sombre principal -->
  <rect width="1400" height="1400" fill="#1a1a2e"/>

  <!-- Éléments géométriques abstraits et vifs -->

  <!-- Cercle central pour un effet de halo subtil -->
  <circle cx="700" cy="700" r="450" fill="#00E6FF" opacity="0.05"/>

  <!-- Quatre éléments "puce" ou "node" aux coins, avec des couleurs vives -->
  <rect x="250" y="250" width="80" height="80" rx="10" fill="#ADFF2F" opacity="0.8"/>
  <rect x="1070" y="250" width="80" height="80" rx="10" fill="#FF007F" opacity="0.8"/>
  <rect x="250" y="1070" width="80" height="80" rx="10" fill="#FF007F" opacity="0.8"/>
  <rect x="1070" y="1070" width="80" height="80" rx="10" fill="#ADFF2F" opacity="0.8"/>

  <!-- Lignes de connexion pour un effet de "réseau" ou "flux de données" -->
  <line x1="290" y1="290" x2="600" y2="500" stroke="#B0B0B0" stroke-width="2" opacity="0.5"/>
  <line x1="1110" y1="290" x2="800" y2="500" stroke="#B0B0B0" stroke-width="2" opacity="0.5"/>
  <line x1="290" y1="1110" x2="600" y2="900" stroke="#B0B0B0" stroke-width="2" opacity="0.5"/>
  <line x1="1110" y1="1110" x2="800" y2="900" stroke="#B0B0B0" stroke-width="2" opacity="0.5"/>
  <line x1="600" y1="500" x2="800" y2="500" stroke="#B0B0B0" stroke-width="2" opacity="0.5"/>
  <line x1="600" y1="900" x2="800" y2="900" stroke="#B0B0B0" stroke-width="2" opacity="0.5"/>
  <line x1="700" y1="500" x2="700" y2="900" stroke="#B0B0B0" stroke-width="2" opacity="0.5"/>

  <!-- Titre de l'épisode (centré et lisible) -->
  <text x="700" y="550" text-anchor="middle" font-size="90" fill="#00E6FF" font-weight="bold">IA Chère, Agents Codeurs</text>
  <text x="700" y="660" text-anchor="middle" font-size="90" fill="#00E6FF" font-weight="bold">et Menaces Tech:</text>
  <text x="700" y="770" text-anchor="middle" font-size="90" fill="#00E6FF" font-weight="bold">Le Grand Virage</text>

  <!-- Nom du podcast (petit, en bas à gauche) -->
  <text x="100" y="1300" text-anchor="start" font-size="36" fill="#B0B0B0">Veille de Marc</text>

  <!-- Date de l'épisode (petit, en bas à droite) -->
  <text x="1300" y="1300" text-anchor="end" font-size="36" fill="#B0B0B0">2026-09-04</text>

</svg>